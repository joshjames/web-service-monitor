name: "Edge Telemetry Fabric Engine Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    name: "Lint, Validate & Test Local Runtime Sandbox"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code Repo
      uses: actions/checkout@v4

    - name: Setup TFLint, Terraform & Conf Tools
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Check Code Style Syntax Formatting
      run: terraform fmt -check -recursive ./terraform

    - name: Initialize and Validate Code Modules
      run: |
        cd terraform
        terraform init -backend=false
        terraform validate

    - name: Stand Up Local Test Integration Sandbox
      run: |
        echo "Building system stack locally using docker-compose targets..."
